// settings.gradle
pluginManagement {
    def flutterSdkPath = file('local.properties').withReader {
        Properties props = new Properties()
        props.load(it)
        return props.getProperty('flutter.sdk')
    }

    if (flutterSdkPath == null) {
        throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
    }

    settings.ext.flutterSdkPath = flutterSdkPath
    includeBuild("${flutterSdkPath}/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = 'app'
include ':app'

// Load Flutter plugins
def flutterProjectRoot = rootProject.projectDir.parentFile
def pluginsFile = new File(flutterProjectRoot, '.flutter-plugins')
if (pluginsFile.exists()) {
    pluginsFile.withReader('UTF-8') { reader ->
        Properties properties = new Properties()
        properties.load(reader)
        properties.each { name, path ->
            def pluginDirectory = flutterProjectRoot.toPath().resolve(path).resolve('android').normalize()
            include ":$name"
            project(":$name").projectDir = pluginDirectory.toFile()
        }
    }
}